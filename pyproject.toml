[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "longshot-split"
version = "0.1.0"
description = "Adaptive splitter for long phone screenshots (chat logs, web captures) - cuts only on safe blank rows. CLI + MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BingKaiWEI" }]
keywords = ["screenshot", "long-image", "split", "segment", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=9.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
longshot-split = "longshot_split.cli:main"
longshot-split-mcp = "longshot_split.mcp_server:serve"

[tool.setuptools.packages.find]
where = ["src"]
